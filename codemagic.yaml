workflows:
  ios-testflight:
    name: iOS TestFlight (FootRank)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: footrank_asc
    environment:
      groups:
        - footrank_secrets
      vars:
        # Set these in Codemagic > Teams > Environment variables > group
        # "footrank_secrets" (mark SUPABASE_ANON_KEY as "Secure" so it is
        # masked in logs, even though an anon key is not sensitive by itself):
        #   SUPABASE_URL
        #   SUPABASE_ANON_KEY
        # Do not reintroduce STRIPE_PUBLISHABLE_KEY or an Apple Pay merchant
        # entitlement. flutter_stripe linked PassKit and App Review rejected
        # 1.1.5 (245) under Guideline 2.1.
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.footballcy.footrank
    # Manual only: this signs a release IPA and uploads it to TestFlight, so
    # it must not run on every push. Start it from the Codemagic dashboard
    # (workflow "iOS TestFlight (FootRank)") on the branch you want to ship.
    triggering:
      events: []
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa (release)
        script: |
          # Build number comes from Codemagic's own build counter (always goes
          # up), offset past every CFBundleVersion already uploaded. App Store
          # Connect rejected 1.1.5 (245) as already used: BUILD_NUMBER ≈ 45
          # plus the old +200 landed on 245. +400 keeps the next upload past
          # that number. The +N in pubspec.yaml is ignored for this workflow.
          flutter build ipa --release \
            --build-number=$((BUILD_NUMBER + 400)) \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
