workflows:
  ios-testflight:
    name: iOS TestFlight (FootRank, live payments)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: footrank_asc
    environment:
      groups:
        - footrank_secrets
      vars:
        # Set these in Codemagic > Teams > Environment variables > group
        # "footrank_secrets" (mark SUPABASE_ANON_KEY and
        # STRIPE_PUBLISHABLE_KEY as "Secure" so they're masked in logs, even
        # though a publishable/anon key is not sensitive by itself):
        #   SUPABASE_URL
        #   SUPABASE_ANON_KEY
        #   STRIPE_PUBLISHABLE_KEY   (pk_live_...)
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.footballcy.footrank
    # Manual only: this hits your live Stripe account, so it should never
    # fire on every push. Start it by hand from the Codemagic dashboard (or
    # wire up a "Start build" button/tag trigger later once you trust it).
    triggering:
      events: []
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa (release, live Stripe key)
        script: |
          flutter build ipa --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
