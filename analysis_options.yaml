# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

linter:
  # Rules beyond flutter_lints, chosen for one of two reasons: they protect
  # rendering performance (const-ness keeps widgets out of the rebuild path,
  # which matters on the Samsung A70 floor this app targets), or they remove a
  # class of avoidable inconsistency.
  #
  # Deliberately NOT enabled: avoid_redundant_argument_values. It flagged 35
  # sites, none of them defects — pure style noise that trains you to ignore
  # the analyzer, which is the opposite of what a lint config is for.
  #
  # Design-token enforcement (no raw colours / radii / font sizes / durations
  # outside lib/core/theme/) is NOT expressible as a standard lint rule — see
  # tool/check_design_tokens.dart, which implements it as a ratcheting gate.
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_super_parameters
    - unnecessary_parenthesis

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
