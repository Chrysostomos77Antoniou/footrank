name: footrank
description: "FootRank - Football ranking and match tracking app."
publish_to: 'none'

version: 1.0.3+55

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  go_router: ^14.0.0
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  image_picker_android: ^0.8.12
  image_picker_platform_interface: ^2.10.0
  video_player: ^2.9.2
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  firebase_crashlytics: ^4.1.5
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.1

# App launcher icon (Image 1)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#0B6E3D"
  adaptive_icon_foreground: "assets/branding/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/video/auth_bg.mp4
    - assets/video/splash_intro.mp4
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-400.ttf
          weight: 400
        - asset: assets/fonts/Sora-500.ttf
          weight: 500
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
