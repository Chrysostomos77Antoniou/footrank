name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Analyze, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Ratcheting design-token gate: fails only when a change ADDS raw
      # colours/radii/font sizes/durations/spacers outside lib/core/theme/.
      # Existing violations are tracked in tool/design_token_baseline.json and
      # burn down as screens migrate — see the header of the script for why
      # this is a ratchet rather than a hard lint.
      - name: Design-token gate
        run: dart run tool/check_design_tokens.dart

      - name: Run tests
        run: flutter test

      # Release build validates what debug can't: R8/minification + Dart AOT
      # compilation (debug uses the JIT VM and skips R8, so a green debug build
      # can still fail at release — as a real APIs-mismatch break did once).
      # No signing secrets needed: build.gradle.kts falls back to debug signing
      # when key.properties is absent.
      - name: Build release APK (validates R8 + AOT)
        run: flutter build apk --release

  build-ios:
    name: Build iOS (no-codesign)
    runs-on: macos-latest
    # macOS runner minutes cost 10x Linux — only run on actual pushes to
    # master, not on every PR, to keep this catch worthwhile but affordable.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No signing secrets needed: --no-codesign skips codesigning while still
      # fully exercising Dart AOT + native iOS plugin/Pod compilation, which
      # the Linux APK job above gives zero coverage for.
      - name: Build iOS (no-codesign, validates plugin/native compilation)
        run: flutter build ios --release --no-codesign
